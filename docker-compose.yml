services:
  boxer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: boxer:dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/workspace
    command: bash

  boxer-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu124}
    image: boxer:gpu
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - .:/workspace
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    profiles:
      - gpu
