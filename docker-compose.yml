services:
  boxer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: boxer:dev
    working_dir: /opt/boxer
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ckpts:/opt/boxer/ckpts
      - ./sample_data:/opt/boxer/sample_data
      - ./output:/opt/boxer/output
      - ./logs:/opt/boxer/logs
    command: bash

  boxer-realsense:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: boxer:realsense
    working_dir: /opt/boxer
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ckpts:/opt/boxer/ckpts
      - ./output:/opt/boxer/output
      - ./logs:/opt/boxer/logs
    # Pass RealSense USB device into the container.
    # Run `rs-enumerate-devices` on the host to confirm the bus path.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    command: >
      python demo_sensor.py
        --detector IDEA-Research/grounding-dino-base
        --labels "chair,table,monitor,sofa,person"
    profiles:
      - realsense

  boxer-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu124}
    image: boxer:gpu
    working_dir: /opt/boxer
    stdin_open: true
    tty: true
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./ckpts:/opt/boxer/ckpts
      - ./sample_data:/opt/boxer/sample_data
      - ./output:/opt/boxer/output
      - ./logs:/opt/boxer/logs
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    profiles:
      - gpu
